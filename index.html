<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>張釋之執法｜大漢司法探案</title><style>
:root{--navy:#102a42;--ink:#17374a;--gold:#e4b75f;--cream:#fffaf0;--teal:#286d71;--line:#dce3df}*{box-sizing:border-box}body{margin:0;background:#e9eeeb;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ca8c27;outline-offset:3px}.shell{max-width:1150px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#d7e4e7;background:var(--navy);padding:14px max(20px,calc((100vw - 1110px)/2));font-size:14px;letter-spacing:1px}header strong{color:#fff;font-size:17px}header button{background:transparent;color:white;border:1px solid #657c89;border-radius:9px;padding:5px 12px}.hero{background:var(--navy);color:white;display:grid;grid-template-columns:1.2fr .8fr;border-radius:22px;overflow:hidden;min-height:350px;box-shadow:0 10px 25px #17374a22}.herotext{padding:36px;align-self:center}.eyebrow{font-size:13px;letter-spacing:3px;color:var(--gold);font-weight:bold}.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.2;margin:12px 0}.hero h2{font-size:20px;color:#d1dedd;margin:0}.hero p{color:#e1e9eb}.heroart{width:100%;height:100%;max-height:430px;object-fit:cover;object-position:center}.btn{border:0;border-radius:10px;background:var(--teal);color:white;font-weight:700;padding:12px 21px;min-height:48px}.gold{background:var(--gold);color:var(--navy)}.outline{background:#fff;border:1px solid #a6b6b9;color:var(--ink)}.danger{background:#9b3f35}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stat{background:#ffffff16;padding:9px 15px;border-radius:8px;font-size:15px}.stat strong{color:#ffdb89;font-size:22px}.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stage{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.stage strong{font-size:20px;display:block}.stage small{color:#547178}.medal{display:inline-flex;align-items:center;justify-content:center;border:1px solid #c6a25e;border-radius:50%;width:34px;height:34px;background:#fff3d4;color:#77501e;font-weight:800;margin-bottom:8px}.note{background:#fff8e7;border:1px solid #e7d8b7;padding:14px 18px;border-radius:12px}.progress{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}.step{flex:1;min-width:80px;padding:8px;border:1px solid #bdc9c9;text-align:center;border-radius:10px;font-size:12px;background:#f5f8f7}.step b{display:block;font-size:16px}.step.active{background:var(--navy);color:white;border-color:var(--navy)}.step.done{background:#dcebe2;border-color:#a7c3b4}.bar{height:8px;background:#d3dcda;border-radius:8px;overflow:hidden;margin:6px 0 15px}.bar div{height:100%;background:var(--teal);transition:width .2s}.qgrid{display:grid;grid-template-columns:1fr 245px;gap:16px;align-items:start}.panel{background:white;border-radius:16px;padding:25px;border:1px solid var(--line);box-shadow:0 5px 16px #1d3d3d08}.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#55747a;font-weight:bold;font-size:14px}.qtitle{font-size:clamp(21px,2.6vw,30px);line-height:1.55;margin:16px 0;white-space:pre-line}.reading{background:#f7f2e7;border-left:4px solid #c8a15b;padding:16px;border-radius:8px;font-size:19px}.reading h3{font-size:14px;margin:0 0 8px;color:#8b652f}.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid #d7e2df;border-radius:12px;padding:14px;margin:10px 0;color:var(--ink);font-size:20px;min-height:60px}.opt.sel{border-color:var(--teal);background:#e4f3ee}.letter{border-radius:8px;background:#e7efed;min-width:34px;height:34px;display:grid;place-items:center;font-weight:800}.sel .letter{background:var(--teal);color:#fff}input.answer,textarea.answer{display:block;width:100%;padding:14px;border:2px solid #bdceca;border-radius:10px;font-size:24px;background:#fcfefd;color:var(--ink)}textarea.answer{min-height:135px;font-size:21px;resize:vertical}.keyboard{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.keyboard button{border:1px solid #d1dcd9;background:#f2f6f4;color:var(--ink);border-radius:6px;min-width:38px;min-height:40px;font-size:21px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}.nav .right{display:flex;gap:8px;flex-wrap:wrap}.side img{width:100%;max-height:260px;object-fit:cover;border-radius:12px}.side{padding:14px}.side p{margin:7px 0;color:#537074;font-size:14px}.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.numgrid button{border:1px solid #ccd7d5;border-radius:7px;background:white;color:#33535a;min-height:35px}.numgrid button.filled{background:#dcebe5}.numgrid button.current{border:2px solid var(--teal);font-weight:800}.numgrid button:disabled{opacity:.35}.resulthead{background:var(--navy);border-radius:18px;color:white;padding:28px;margin-bottom:16px}.score{font-size:52px;font-weight:800;color:var(--gold);line-height:1.2}.scoreline{display:flex;gap:28px;flex-wrap:wrap}.review{margin:10px 0;border:1px solid #dbe4e0;padding:14px;border-radius:10px;background:white}.review summary{cursor:pointer;font-weight:bold}.review p{margin:8px 0;white-space:pre-wrap}.correct{color:#1e754d}.wrong{color:#9b3f35}.mark{padding:6px 10px;border:1px solid #bccac7;border-radius:8px}.foot{color:#61777c;font-size:12px;margin:18px 0}.keyrow{display:flex;gap:5px;flex-wrap:wrap}.key{background:#ffffff13;color:#8aa3af;border-radius:7px;padding:5px 10px}.key.got{background:#f1d58c;color:#493713}.muted{color:#5c777a}.matchword{padding:15px;text-align:center;background:#f7ebc9;border:1px solid #e2c87e;border-radius:10px;font-size:24px;font-weight:bold;margin:10px 0}.drop{padding:15px;border:2px dashed #87a5a2;border-radius:10px;color:#537074;text-align:center}.drop.has{border-style:solid;background:#e4f3ee;color:var(--ink)}@media(max-width:730px){.shell{padding:12px}.hero{grid-template-columns:1fr}.herotext{padding:24px}.heroart{height:210px;object-position:center 65%}.stages{grid-template-columns:repeat(2,1fr)}.qgrid{grid-template-columns:1fr}.side img{max-height:150px;object-position:center 30%}.side{order:2}.panel{padding:17px}.opt{font-size:18px}.numgrid{grid-template-columns:repeat(10,1fr)}.step{min-width:80px}.qtitle{font-size:22px}}@media print{header,.nav,.btn,.foot{display:none}.shell{max-width:none}.review{break-inside:avoid}.resulthead{color:#111;background:white}.score{color:#111}}
</style></head><body><header><strong>南和國中｜國文數位學習</strong><button id="full">全螢幕</button></header><main id="app" class="shell"></main><script>
const Q=[{"section": "國字與注音", "p": "請寫出引號內注音所代表的國字：中「ㄨㄟˋ」橋", "a": "渭", "e": "渭水上的古橋。", "type": "text"}, {"section": "國字與注音", "p": "請寫出引號內注音所代表的國字：乘「ㄩˊ」馬驚", "a": "輿", "e": "乘輿指帝王乘坐的車子。", "type": "text"}, {"section": "國字與注音", "p": "請寫出引號內注音所代表的國字：「ㄋㄧˋ」橋下", "a": "匿", "e": "匿是躲藏。", "type": "text"}, {"section": "國字與注音", "p": "請寫出引號內注音所代表的國字：立「ㄓㄨ」之", "a": "誅", "e": "誅在課文指殺。", "type": "text"}, {"section": "國字與注音", "p": "請寫出引號內注音所代表的國字：「ㄅㄧˋ」下", "a": "陛", "e": "陛下是對帝王的尊稱。", "type": "text"}, {"section": "國字與注音", "p": "請寫出引號內國字的注音：「屬」之廷尉", "a": "ㄓㄨˇ", "e": "屬通囑，表示交付。", "type": "text"}, {"section": "國字與注音", "p": "請寫出引號內國字的注音：聞「蹕」", "a": "ㄅㄧˋ", "e": "帝王出巡時管制交通。", "type": "text"}, {"section": "國字與注音", "p": "請寫出引號內國字的注音：以為「行」已過", "a": "ㄏㄤˊ", "e": "此處指隊伍。", "type": "text"}, {"section": "國字與注音", "p": "請寫出引號內國字的注音：廷尉奏「當」", "a": "ㄉㄤ", "e": "此處指判決。", "type": "text"}, {"section": "國字與注音", "p": "請寫出引號內國字的注音：吾馬「賴」柔和", "a": "ㄌㄞˋ", "e": "賴在此引申為幸虧。", "type": "text"}, {"section": "改錯字", "p": "找出句中唯一的錯字，輸入正確的國字：\n法官辦案應該明境高懸，不偏袒任何人。", "a": "鏡", "e": "明鏡高懸：比喻官吏判案公正。", "type": "text"}, {"section": "改錯字", "p": "找出句中唯一的錯字，輸入正確的國字：\n看到有人破壞規定，他勃然大恕。", "a": "怒", "e": "勃然大怒：突然非常生氣。", "type": "text"}, {"section": "改錯字", "p": "找出句中唯一的錯字，輸入正確的國字：\n他決定洗心格面，改掉自己的壞習慣。", "a": "革", "e": "洗心革面：徹底悔改。", "type": "text"}, {"section": "改錯字", "p": "找出句中唯一的錯字，輸入正確的國字：\n她禮直氣壯地說明自己的理由。", "a": "理", "e": "理直氣壯：理由正當充分，說話有氣勢。", "type": "text"}, {"section": "改錯字", "p": "找出句中唯一的錯字，輸入正確的國字：\n不公正的做法受到眾人口株筆伐。", "a": "誅", "e": "口誅筆伐：用言語和文字加以譴責。", "type": "text"}, {"section": "詞語解釋", "p": "「治問」的意思是什麼？", "opts": ["治理國家", "審問", "詢問道路", "慰問"], "a": 1, "e": "治問：審問。", "type": "choice"}, {"section": "詞語解釋", "p": "「令他馬」的「令」是什麼意思？", "opts": ["命令", "使者", "假使", "美好"], "a": 2, "e": "令：假使。", "type": "choice"}, {"section": "詞語解釋", "p": "「天下之平也」的「平」是什麼意思？", "opts": ["標準", "平地", "平常", "平靜"], "a": 0, "e": "平：標準。", "type": "choice"}, {"section": "詞語解釋", "p": "「而廷尉乃當之罰金」的「乃」是什麼意思？", "opts": ["於是", "才", "你的", "竟然"], "a": 3, "e": "乃：竟然、居然。", "type": "choice"}, {"section": "詞語解釋", "p": "「唯陛下察之」的「唯」表達何種語氣？", "opts": ["禁止", "期望", "責備", "懷疑"], "a": 1, "e": "唯：表示期望的語氣。", "type": "choice"}, {"section": "詞語配對", "p": "將詞卡「廷尉」與最適合的解釋配對。", "opts": ["古代最高司法官員", "帝王乘坐的車子", "出巡時管制交通、禁止通行", "向皇上報告判決內容", "古代臣民對帝王的尊稱"], "a": 0, "e": "廷尉：古代最高司法官員。", "type": "match"}, {"section": "詞語配對", "p": "將詞卡「乘輿」與最適合的解釋配對。", "opts": ["古代最高司法官員", "帝王乘坐的車子", "出巡時管制交通、禁止通行", "向皇上報告判決內容", "古代臣民對帝王的尊稱"], "a": 1, "e": "乘輿：帝王乘坐的車子。", "type": "match"}, {"section": "詞語配對", "p": "將詞卡「蹕」與最適合的解釋配對。", "opts": ["古代最高司法官員", "帝王乘坐的車子", "出巡時管制交通、禁止通行", "向皇上報告判決內容", "古代臣民對帝王的尊稱"], "a": 2, "e": "蹕：出巡時管制交通、禁止通行。", "type": "match"}, {"section": "詞語配對", "p": "將詞卡「奏當」與最適合的解釋配對。", "opts": ["古代最高司法官員", "帝王乘坐的車子", "出巡時管制交通、禁止通行", "向皇上報告判決內容", "古代臣民對帝王的尊稱"], "a": 3, "e": "奏當：向皇上報告判決內容。", "type": "match"}, {"section": "詞語配對", "p": "將詞卡「陛下」與最適合的解釋配對。", "opts": ["古代最高司法官員", "帝王乘坐的車子", "出巡時管制交通、禁止通行", "向皇上報告判決內容", "古代臣民對帝王的尊稱"], "a": 4, "e": "陛下：古代臣民對帝王的尊稱。", "type": "match"}, {"section": "選詞填空", "p": "面對不合理的要求，他提出證據與理由，努力維護自己的權益，這是（　）。", "opts": ["奉公守法", "據理力爭", "目無法紀", "不卑不亢", "從諫如流"], "a": 1, "e": "據理力爭：依據道理努力爭取。", "type": "choice"}, {"section": "選詞填空", "p": "每位公民都應遵守法律，不徇私舞弊，做到（　）。", "opts": ["奉公守法", "據理力爭", "目無法紀", "不卑不亢", "從諫如流"], "a": 0, "e": "奉公守法：謹守法紀，不徇私。", "type": "choice"}, {"section": "選詞填空", "p": "有人明知規定卻故意破壞，完全不把法律放在眼裡，可說是（　）。", "opts": ["奉公守法", "據理力爭", "目無法紀", "不卑不亢", "從諫如流"], "a": 2, "e": "目無法紀：無視法律。", "type": "choice"}, {"section": "選詞填空", "p": "面對長官時，他既不低聲下氣，也不傲慢無禮，表現得（　）。", "opts": ["奉公守法", "據理力爭", "目無法紀", "不卑不亢", "從諫如流"], "a": 3, "e": "不卑不亢：不自卑，也不傲慢。", "type": "choice"}, {"section": "選詞填空", "p": "主管願意接受合理的勸告，並修正原本的決定，可說是（　）。", "opts": ["奉公守法", "據理力爭", "目無法紀", "不卑不亢", "從諫如流"], "a": 4, "e": "從諫如流：樂於接受勸告。", "type": "choice"}, {"section": "基礎選擇題", "p": "〈張釋之執法〉的作者是誰？", "opts": ["司馬光", "韓愈", "司馬遷", "柳宗元"], "a": 2, "e": "作者為西漢司馬遷。", "type": "choice"}, {"section": "基礎選擇題", "p": "本文節選自哪一本書？", "opts": ["《史記》", "《論語》", "《孟子》", "《資治通鑑》"], "a": 0, "e": "本文節選自《史記》。", "type": "choice"}, {"section": "基礎選擇題", "p": "《史記》以記載人物事蹟為主，屬於哪一種史書體裁？", "opts": ["編年體", "語錄體", "書信體", "紀傳體"], "a": 3, "e": "《史記》是紀傳體史書。", "type": "choice"}, {"section": "基礎選擇題", "p": "《史記》記載的歷史範圍為何？", "opts": ["秦始皇至漢文帝", "黃帝至漢武帝", "漢文帝至漢武帝", "唐太宗至宋太祖"], "a": 1, "e": "課本指出《史記》記載黃帝至漢武帝之間的歷史。", "type": "choice"}, {"section": "基礎選擇題", "p": "下列哪一句的「走」與「有一人從橋下走出」的意思最接近？", "opts": ["走訪老朋友", "走路去學校", "奔走逃離現場", "走過一段長廊"], "a": 2, "e": "課文的走是跑；奔走在此最接近。", "type": "choice"}, {"section": "基礎選擇題", "p": "「上行出中渭橋」的「上」指誰？", "opts": ["漢文帝", "張釋之", "縣民", "騎兵"], "a": 0, "e": "上指皇上，也就是漢文帝。", "type": "choice"}, {"section": "基礎選擇題", "p": "「民安所錯其手足」中的「錯」通哪一個字？", "opts": ["措", "挫", "銼", "搓"], "a": 0, "e": "錯通措，意思是安放。", "type": "choice"}, {"section": "基礎選擇題", "p": "向別人稱呼自己的父親，何者最適合？", "opts": ["令尊", "貴府", "家父", "令郎"], "a": 2, "e": "家父是稱自己的父親的謙詞。", "type": "choice"}, {"section": "基礎選擇題", "p": "想禮貌地稱呼對方的父親，應使用哪個詞？", "opts": ["敝人", "家父", "舍弟", "令尊"], "a": 3, "e": "令尊是稱對方父親的敬詞。", "type": "choice"}, {"section": "基礎選擇題", "p": "「令他馬，固不敗傷我乎？」屬於哪一種問句？", "opts": ["提問（自問自答）", "激問（反問）", "懸問（留下疑問）", "一般疑問（等待資訊）"], "a": 1, "e": "以反問加強語氣，屬於激問。", "type": "choice"}, {"section": "課文理解", "p": "縣民為什麼先躲在橋下？", "opts": ["想在橋下休息", "聽說皇帝出巡、交通管制", "打算攔截皇帝", "等候張釋之到來"], "a": 1, "e": "縣民聞蹕而匿於橋下。", "type": "choice"}, {"section": "課文理解", "p": "縣民後來為什麼從橋下跑出來？", "opts": ["以為皇帝的隊伍已經過去", "受到廷尉命令", "想向皇帝告狀", "想故意驚嚇馬匹"], "a": 0, "e": "他誤以為隊伍已經過了。", "type": "choice"}, {"section": "課文理解", "p": "請選出事件的正確先後順序。", "opts": ["文帝不滿→縣民被捕→廷尉判罰金→文帝接受", "廷尉判罰金→縣民被捕→文帝接受→文帝不滿", "縣民被捕→文帝接受→廷尉判罰金→文帝不滿", "縣民被捕→廷尉判罰金→文帝不滿→文帝接受"], "a": 3, "e": "本文按事件先後敘述，中間張釋之說明依法判決的理由。", "type": "choice"}, {"section": "課文理解", "p": "張釋之為何反對加重縣民的處罰？", "opts": ["因為縣民與他是朋友", "因為皇帝沒有受傷，所以完全無罪", "因為任意加重處罰會使法律失去人民信任", "因為他想取消交通管制"], "a": 2, "e": "法律須共同遵守，任意加重會失去公信力。", "type": "choice"}, {"section": "課文理解", "p": "文帝最後說「廷尉當是也」，最能表現他哪一項特質？", "opts": ["能接受合理的勸諫", "凡事不願做決定", "只重視自身安危", "堅持原本的看法"], "a": 0, "e": "文帝最後認同張釋之的判決。", "type": "choice"}, {"section": "閱讀測驗", " const answered=i=>ans[i]!==null&&String(ans[i]).trim()!=='';const count=()=>ans.filter((_,i)=>answered(i)).length;const norm=s=>String(s??'').normalize('NFKC').replace(/[\sˉ，。、「」]/g,'');const correct=i=>Q[i].type==='open'?null:Q[i].type==='text'?norm(ans[i])===norm(Q[i].a):ans[i]===Q[i].a;const auto=()=>Q.reduce((n,q,i)=>n+(correct(i)===true?2:0),0);const ansText=i=>!answered(i)?'未作答':Q[i].opts?Q[i].opts[ans[i]]:ans[i];const keyText=i=>Q[i].opts?Q[i].opts[Q[i].a]:Q[i].a;

function home(){app.innerHTML=`<div class="hero"><div class="herotext"><div class="eyebrow">第五課 · 司法探案任務</div><h1>大漢司法探案</h1><h2>張釋之執法｜六關50題</h2><p>中渭橋發生了一起驚動皇帝的案件。你是見習廷尉，必須通過文字、詞義及閱讀的考驗，才能完成最後裁決。</p><div class="stats"><div class="stat"><strong>6</strong> 關</div><div class="stat"><strong>50</strong> 題</div><div class="stat"><strong>100</strong> 分</div></div><button class="btn gold" onclick="start()">接受任務　›</button></div><img class="heroart" src="${A.incident}" alt="課本插畫：中渭橋車馬受驚"></div><div class="stages">${stages.map((s,i)=>`<div class="stage"><span class="medal">${i+1}</span><strong>${s.name}</strong><small>${s.desc}</small><div>${s.end-s.start} 題 ／ ${(s.end-s.start)*2} 分</div></div>`).join('')}</div><div class="note">作答時不顯示答案，可在同一關回頭修改。提交六關後，前48題自動計分，最後兩題由教師依規準評分。沒有倒數或扣分懲罰。插圖取自你提供的課本及既有和中角色。</div><p class="foot">教材依據：〈張釋之執法〉課本及補充講義；校園閱讀短文為本遊戲新編情境。</p>`}
function start(){screen='play';stage=0;idx=0;render()}
function question(){let q=Q[idx],s=stages[stage];let match=q.type==='match';app.innerHTML=`<div class="progress">${stages.map((v,i)=>`<div class="step ${i<stage?'done':i===stage?'active':''}"><b>${i<stage?'✓ ':''}${i+1}</b>${v.name}</div>`).join('')}</div><div class="qmeta"><span>第 ${stage+1} 關／6　·　${s.name}</span><span id="count">已作答 ${count()}／50</span></div><div class="bar"><div id="bar" style="width:${count()*2}%"></div></div><div class="qgrid"><section class="panel"><div class="qmeta"><span>${q.section}　｜　第 ${idx+1} 題</span><span>2 分</span></div>${q.reading?`<div class="reading"><h3>閱讀線索｜校園球賽事件</h3>${esc(q.reading)}</div>`:''}<h2 class="qtitle">${esc(q.p)}</h2>${q.opts?`${match?'<div class="drop '+(answered(idx)?'has':'')+'" id="drop" ondragover="event.preventDefault()" ondrop="drop(event)">'+(answered(idx)?esc(ansText(idx)):'將解釋卡拖到這裡，也可直接點選')+'</div>':''}${q.opts.map((o,i)=>`<button class="opt ${ans[idx]===i?'sel':''}" ${match?'draggable="true" ondragstart="event.dataTransfer.setData(\'text/plain\',\''+i+'\')"':''} onclick="pick(${i})"><span class="letter">${'ABCDE'[i]}</span><span>${esc(o)}</span></button>`).join('')}`:q.type==='open'?`<label for="entry" class="muted">請用自己的話回答</label><textarea class="answer" id="entry" oninput="recordEntry(this.value)">${esc(ans[idx]??'')}</textarea>`:`<label for="entry" class="muted">${idx>=5&&idx<=9?'可用注音輸入或點選下方注音鍵':'請輸入一個正確國字'}</label><input class="answer" id="entry" autocomplete="off" value="${esc(ans[idx]??'')}" oninput="recordEntry(this.value)">${idx>=5&&idx<=9?`<div class="keyboard">${[...'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˊˇˋ˙'].map(v=>`<button onclick="insert('${v}')">${v}</button>`).join('')}<button onclick="erase()">⌫</button><button onclick="clearEntry()">清空</button></div>`:''}`}
<div class="nav"><button class="btn outline" onclick="go(${idx-1})" ${idx===s.start?'disabled':''}>‹ 上一題</button><div class="right"><button class="btn outline" onclick="skip()">稍後作答</button>${idx<s.end-1?'<button class="btn" onclick="go(idx+1)">下一題 ›</button>':`<button class="btn" onclick="submitStage()">${stage===5?'完成任務・交卷':'提交本關・取得令牌'} ›</button>`}</div></div></section><aside class="panel side"><img src="${A[s.art]}" alt="${s.name}情境插畫"><p>本關題號（綠色表示已作答）</p><div class="numgrid">${Array.from({length:s.end-s.start},(_,j)=>s.start+j).map(i=>`<button id="num${i}" class="${answered(i)?'filled':''} ${i===idx?'current':''}" onclick="go(${i})">${i+1}</button>`).join('')}</div><p>先思考，再作答；本關提交後不能回頭修改。</p></aside></div><p class="foot">本題答案會在全部交卷後揭曉。</p>`}
function update(){document.getElementById('count').textContent=`已作答 ${count()}／50`;document.getElementById('bar').style.width=count()*2+'%';document.getElementById('num'+idx).classList.toggle('filled',answered(idx));save()}
function pick(i){ans[idx]=i;render()}function drop(e){e.preventDefault();let n=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(n)&&n>=0&&n<Q[idx].opts.length)pick(n)}function recordEntry(v){ans[idx]=v;update()}function insert(v){let el=document.getElementById('entry');el.value+=v;recordEntry(el.value);el.focus()}function erase(){let el=document.getElementById('entry');el.value=el.value.slice(0,-1);recordEntry(el.value);el.focus()}function clearEntry(){let el=document.getElementById('entry');el.value='';recordEntry('');el.focus()}function go(n){let s=stages[stage];if(n>=s.start&&n<s.end){idx=n;render()}}function skip(){if(idx<stages[stage].end-1)go(idx+1);else submitStage()}
function submitStage(){let s=stages[stage],missing=Array.from({length:s.end-s.start},(_,i)=>i+s.start).filter(i=>!answered(i));if(missing.length&&!confirm('本關尚有 '+missing.length+' 題未作答。確定提交？')){go(missing[0]);return}if(!confirm(stage===5?'確定交卷？交卷後顯示成績及解析。':'確定提交本關？之後將不能修改。'))return;if(stage===5){screen='result'}else{stage++;idx=stages[stage].start}render()}
function result(){let all=marks.every(v=>v!==null), total=auto()+marks.reduce((a,b)=>a+(b??0),0);app.innerHTML=`<div class="resulthead"><div class="eyebrow">六關任務完成</div><h1>司法探案成果</h1><div class="scoreline"><div><div>客觀題成績</div><div class="score">${auto()} <small style="font-size:22px">/ 96</small></div></div><div><div>總分 ${all?'（已評分）':'（待教師評分）'}</div><div class="score">${all?total:'—'} <small style="font-size:22px">/ 100</small></div></div></div><div class="keyrow">${stages.map((_,i)=>`<span class="key got">✓ 令牌 ${i+1}</span>`).join('')}</div></div><div class="stages">${stages.map((s,i)=>{let points=Q.slice(s.start,s.end).reduce((a,q,j)=>a+(correct(s.start+j)===true?2:0),0),max=(s.end-s.start)*2-(i===5?4:0);return `<div class="stage"><small>第 ${i+1} 關</small><strong>${s.name}</strong><div>${points}／${max} 分 ${i===5?'＋手動評分4分':''}</div></div>`}).join('')}</div><div class="panel"><h2>教師評分區｜第49、50題</h2>${[48,49].map((i,j)=>`<div class="review"><strong>第 ${i+1} 題｜${esc(Q[i].p)}</strong><p>學生答案：${esc(ansText(i))}</p><p>${esc(Q[i].e)}</p><p>${esc(Q[i].r)}</p><label>給分：<select class="mark" onchange="mark(${j},this.value)"><option value="" ${marks[j]===null?'selected':''}>尚未評分</option>${[0,1,2].map(n=>`<option ${marks[j]===n?'selected':''} value="${n}">${n} 分</option>`).join('')}</select></label></div>`).join('')}<p class="muted">此區需教師人工核對；未評分前不顯示100分制總分。</p><div class="nav"><button class="btn outline" onclick="toggleReview()">${showReview?'收起':'展開'}全部答案與解析</button><div class="right"><button class="btn outline" onclick="print()">列印成果</button><button class="btn" onclick="download()">下載作答紀錄</button><button class="btn danger" onclick="restart()">重新開始</button></div></div></div>${showReview?`<h2>逐題答案與解析</h2>${Q.map((q,i)=>`<details class="review"><summary><span class="${correct(i)===true?'correct':correct(i)===false?'wrong':''}">${q.type==='open'?'人工評分':correct(i)?'✓ 正確':'✗ 待訂正'}</span>　${i+1}. ${esc(q.p)}</summary><p>你的答案：${esc(ansText(i))}</p>${q.type==='open'?'':`<p>正確答案：${esc(keyText(i))}</p>`}<p>${esc(q.e)}</p></details>`).join('')}`:''}<p class="foot">紀錄只儲存在目前瀏覽器，不會上傳至教師端。公開網站不要求學生輸入姓名。</p>`}
function mark(j,v){marks[j]=v===''?null:Number(v);render()}function toggleReview(){showReview=!showReview;render()}function restart(){if(!confirm('重新開始會清除這次作答紀錄，確定？'))return;ans=Array(50).fill(null);marks=[null,null];stage=0;idx=0;showReview=false;screen='home';render()}
function download(){let total=marks.every(x=>x!==null)?auto()+marks[0]+marks[1]:'待評分';let lines=['張釋之執法｜大漢司法探案','客觀題 '+auto()+'/96','總分 '+total+'/100',...Q.map((q,i)=>`${i+1}. ${q.p}\n作答：${ansText(i)}\n${q.type==='open'?'人工給分：'+(marks[i-48]??'待評分'):correct(i)?'正確 2分':'錯誤 0分；正解：'+keyText(i)}\n解析：${q.e}`)];let u=URL.createObjectURL(new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='張釋之執法_作答紀錄.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};try{let v=JSON.parse(localStorage.getItem('zhang-case-v1'));if(v&&Array.isArray(v.ans)&&v.ans.length===50&&['home','play','result'].includes(v.screen)){({ans,stage,idx,screen,marks,showReview}=v)}}catch{}render();
</script></body></html>
